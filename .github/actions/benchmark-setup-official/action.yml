name: Benchmark actions/setup-go
description: Set up this benchmark candidate with its cache policy.
inputs:
  go-version:
    description: Exact Go version.
    required: true
  cache:
    description: Enable module and build caching.
    default: 'true'
  cache-dependency-path:
    description: Dependency manifests consumed by this workload.
    default: '**/go.sum'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/benchmark-environment
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Record Go environment
      shell: bash
      run: |
        go version
        go env GOCACHE GOMODCACHE GOTOOLCHAIN
        {
          echo '### actions/setup-go v7.1.0'
          echo 'Pinned action: `d8cbb8045d7f43706b9177cceb36c1f91a6644d5`'
          echo "Go: $(go env GOVERSION)"
          echo "Runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          echo 'Go cache enabled: ${{ inputs.cache }}'
        } >> "${GITHUB_STEP_SUMMARY}"
