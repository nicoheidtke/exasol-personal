name: setup-go
description: Setup Go and related tools
inputs:
  setup-go-better-token:
    description: Read-only contents token for the private Go installer
    required: true
  cache-scope:
    description: Matrix variant namespace
    default: ''
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: ./.github/actions/setup-go-better
      with:
        token: ${{ inputs.setup-go-better-token }}
        cache-scope: ${{ inputs.cache-scope }}

    - name: Setup Task
      uses: ./.github/actions/setup-task

    - name: Configure cache directories
      shell: bash
      run: |
        golangci_lint_cache="${RUNNER_TEMP}/golangci-lint-cache"
        tflint_plugin_cache="${RUNNER_TEMP}/tflint-plugins"

        mkdir -p "${golangci_lint_cache}" "${tflint_plugin_cache}"

        {
          echo "GOLANGCI_LINT_CACHE=${golangci_lint_cache}"
          echo "TFLINT_PLUGIN_DIR=${tflint_plugin_cache}"
        } >> "${GITHUB_ENV}"

    - name: Cache golangci-lint
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.GOLANGCI_LINT_CACHE }}
        key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/devtools/go.sum', 'tools/cleanup/go.sum') }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-

    - name: Cache tflint plugins
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TFLINT_PLUGIN_DIR }}
        key: tflint-${{ runner.os }}
