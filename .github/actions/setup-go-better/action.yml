name: setup-go-better
description: Check out the private Go installer and set up Go
inputs:
  token:
    description: Read-only contents token for nicoheidtke/setup-go-better
    required: true
  go-version-file:
    description: Go version manifest
    default: go.mod
  cache:
    description: Go cache mode (off, restore, or restore-save)
    default: restore-save
  cache-layout:
    description: Separate module and build snapshots
    default: split
  cache-build-save:
    description: Save build snapshots on the default branch while saving changed modules independently
    default: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  cache-scope:
    description: Matrix variant namespace
    default: ''
runs:
  using: composite
  steps:
    - name: Check out private Go installer
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: nicoheidtke/setup-go-better
        ref: 880e345180bcf8f3a2780913f9c509ae5ad23b97 # v0.0.0-preview.20261112
        token: ${{ inputs.token }}
        path: .github/private-actions/setup-go-better
        persist-credentials: false
    - name: Set up Go
      uses: ./.github/private-actions/setup-go-better
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
        cache-layout: ${{ inputs.cache-layout }}
        cache-build-save: ${{ inputs.cache-build-save }}
        cache-compression: zstd
        cache-scope: ${{ inputs.cache-scope }}
        cache-dependency-path: |
          go.mod
          go.sum
          tools/devtools/go.mod
          tools/devtools/go.sum
          tools/cleanup/go.mod
          tools/cleanup/go.sum
