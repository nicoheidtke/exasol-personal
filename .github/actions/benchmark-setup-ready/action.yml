name: Benchmark nicoheidtke/ready-setup-go
description: Set up this benchmark candidate with its cache policy.
inputs:
  go-version:
    description: Exact Go version.
    required: true
  cache:
    description: Enable module and build caching.
    default: 'true'
  cache-dependency-path:
    description: Dependency manifests consumed by this workload; empty scans all modules.
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/benchmark-environment
    - name: Set up Go
      uses: nicoheidtke/ready-setup-go@15d4503a42effc6b98cdb6adc3821346a0eb1ba0 # v2.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.cache == 'true' && 'restore-save' || 'off' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        cache-layout: split
        cache-module-scope: ${{ github.job == 'lint-go' && 'ci-lint-modules' || 'ci-compile-modules' }}
        cache-storage: archive
        cache-compression: zstd
        cache-scope: ${{ runner.os }}-${{ runner.arch }}
    - name: Record Go environment
      shell: bash
      run: |
        go version
        go env GOCACHE GOMODCACHE GOTOOLCHAIN
        {
          echo '### nicoheidtke/ready-setup-go v2.0.0'
          echo 'Pinned action: `15d4503a42effc6b98cdb6adc3821346a0eb1ba0`'
          echo "Go: $(go env GOVERSION)"
          echo "Runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          echo 'Go cache enabled: ${{ inputs.cache }}'
        } >> "${GITHUB_STEP_SUMMARY}"
