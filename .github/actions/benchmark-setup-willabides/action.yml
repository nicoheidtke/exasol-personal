name: Benchmark willabides/setup-go-faster
description: Set up this benchmark candidate with its cache policy.
inputs:
  go-version:
    description: Exact Go version.
    required: true
  cache:
    description: Enable module and build caching.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/benchmark-environment
    - name: Set up Go
      id: go
      uses: willabides/setup-go-faster@fea1b51f8e1f07229131e4438f235ad219880d31 # v1.19.0
      with:
        go-version: ${{ inputs.go-version }}
    - name: Cache shared Go modules
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go.outputs.GOMODCACHE }}
        key: willabides-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.go-version }}-${{ github.job == 'lint-go' && 'lint' || 'compile' }}-${{ github.job == 'lint-go' && hashFiles('**/go.sum') || github.job == 'tests-unit' && hashFiles('go.sum', 'tools/cleanup/go.sum') || hashFiles('go.sum') }}
        restore-keys: |
          willabides-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.go-version }}-${{ github.job == 'lint-go' && 'lint' || 'compile' }}-
    - name: Cache job build outputs
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go.outputs.GOCACHE }}
        key: willabides-build-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.go-version }}-${{ github.sha }}
        restore-keys: |
          willabides-build-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.go-version }}-
    - name: Record Go environment
      shell: bash
      run: |
        go version
        go env GOCACHE GOMODCACHE GOTOOLCHAIN
        {
          echo '### willabides/setup-go-faster v1.19.0'
          echo 'Pinned action: `fea1b51f8e1f07229131e4438f235ad219880d31`'
          echo "Go: $(go env GOVERSION)"
          echo "Runner image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          echo 'Go cache enabled: ${{ inputs.cache }}'
        } >> "${GITHUB_STEP_SUMMARY}"
